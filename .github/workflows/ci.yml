name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify repository documentation
        run: test -s README.md
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.2 "README.md" "pilotos/*.md"
